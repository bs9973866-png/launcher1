[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaura-launcher"
version = "0.1.0"
description = "A customizable Minecraft Java Edition launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.8,<7",
  "minecraft-launcher-lib>=8.0,<9",
  "requests>=2.31",
  "keyring>=25.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
